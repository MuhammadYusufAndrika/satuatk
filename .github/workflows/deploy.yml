name: Deploy SATUATK Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: satuatk-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'
  APP_DIR: /home/taud1675/public_html/satuatk.yusufandrika.dev
  APP_URL: https://satuatk.yusufandrika.dev
  TEMP_DIR: /home/taud1675/satuatk-deploy

jobs:
  deploy:
    name: Build & Deploy SATUATK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=""

          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}" ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.SSH_PORT }}" ] && missing="$missing SSH_PORT"

          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum lengkap:$missing"
            exit 1
          fi

          echo "Deployment secrets OK."

      - name: Check development backdoor
        shell: bash
        run: |
          if grep -rn "bypass-login" routes/ app/ 2>/dev/null; then
            echo "::error::Route bypass-login masih ditemukan."
            echo "Hapus route development sebelum production."
            exit 1
          fi

          echo "Security check OK."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, fileinfo, openssl, tokenizer, xml, ctype, curl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify Vite build
        shell: bash
        run: |
          if [ ! -f "public/build/manifest.json" ] && \
             [ ! -f "public/build/.vite/manifest.json" ]; then
            echo "::error::Vite manifest tidak ditemukan."
            ls -lah public || true
            exit 1
          fi

          echo "Vite build OK."
          du -sh public/build

      - name: Prepare deployment package
        shell: bash
        run: |
          rm -rf .git .github node_modules tests

          rm -f \
            public/hot \
            composer.phar \
            npm-debug.log \
            yarn-error.log

          # Jangan kirim .env dari repository.
          rm -f .env .env.*

          # Runtime data tidak perlu dikirim dari GitHub runner.
          rm -rf storage/logs/*
          rm -rf storage/framework/cache/*
          rm -rf storage/framework/sessions/*
          rm -rf storage/framework/views/*

          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment-info

          echo "Deployment package ready:"
          du -sh vendor || true
          du -sh public/build || true

      # Bersihkan temporary directory dari deployment sebelumnya.
      - name: Prepare temporary directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            TEMP_DIR="${{ env.TEMP_DIR }}"

            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            echo "Temporary deployment directory ready:"
            echo "$TEMP_DIR"

      # appleboy/scp-action melakukan TAR + SCP sendiri.
      # Tidak perlu membuat .tar.gz manual.
      - name: Upload application to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ env.TEMP_DIR }}
          overwrite: true

      - name: Install deployment on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            TEMP_DIR="${{ env.TEMP_DIR }}"
            ENV_BACKUP="/home/${{ secrets.SSH_USER }}/.satuatk-env-backup"

            echo "Preparing production deployment..."

            if [ ! -d "$TEMP_DIR" ]; then
              echo "ERROR: Temporary deployment directory tidak ditemukan:"
              echo "$TEMP_DIR"
              exit 1
            fi

            if [ ! -f "$TEMP_DIR/artisan" ]; then
              echo "ERROR: File artisan tidak ditemukan di temporary deployment."
              echo "Isi temporary directory:"
              ls -lah "$TEMP_DIR" || true
              exit 1
            fi

            mkdir -p "$APP_DIR"

            # Backup .env production sebelum mengganti source code.
            rm -f "$ENV_BACKUP"

            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" "$ENV_BACKUP"
              echo ".env production backed up."
            else
              echo "WARNING: .env production belum ditemukan."
            fi

            # Pertahankan storage production.
            cd "$APP_DIR"

            find . \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name '.env' \
              ! -name 'storage' \
              -exec rm -rf -- {} +

            echo "Copying new application..."
            cp -a "$TEMP_DIR"/. "$APP_DIR"/

            # Pastikan .env hasil upload tidak pernah digunakan.
            rm -f "$APP_DIR/.env"

            if [ -f "$ENV_BACKUP" ]; then
              mv "$ENV_BACKUP" "$APP_DIR/.env"
              echo ".env production restored."
            fi

            # Pastikan runtime directories Laravel tersedia.
            mkdir -p \
              "$APP_DIR/storage/app" \
              "$APP_DIR/storage/framework/cache" \
              "$APP_DIR/storage/framework/sessions" \
              "$APP_DIR/storage/framework/views" \
              "$APP_DIR/storage/logs" \
              "$APP_DIR/bootstrap/cache"

            rm -rf "$TEMP_DIR"

            echo "Application installed successfully."

      - name: Run Laravel deployment tasks
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            PHP_BIN="/opt/alt/php82/usr/bin/php"

            cd "$APP_DIR"

            echo "======================================"
            echo " SATUATK Production Deployment"
            echo "======================================"

            echo "PHP version:"
            "$PHP_BIN" -v | head -n 1

            if [ ! -f ".env" ]; then
              echo "ERROR: .env production tidak ditemukan."
              echo "Lokasi seharusnya: $APP_DIR/.env"
              exit 1
            fi

            if ! grep -q '^APP_KEY=base64:' .env; then
              echo "ERROR: APP_KEY belum dikonfigurasi."
              exit 1
            fi

            if ! grep -q '^APP_ENV=production' .env; then
              echo "WARNING: APP_ENV bukan production."
            fi

            if ! grep -q '^APP_DEBUG=false' .env; then
              echo "WARNING: APP_DEBUG belum false."
            fi

            chmod -R 775 storage bootstrap/cache || true

            # Shared hosting menonaktifkan proc_open.
            # Command non-esensial dibuat toleran terhadap kegagalan.
            "$PHP_BIN" artisan optimize:clear || true

            # Migration production. Jangan migrate:fresh / seed otomatis.
            "$PHP_BIN" artisan migrate --force

            "$PHP_BIN" artisan config:cache || true
            "$PHP_BIN" artisan route:cache || true
            "$PHP_BIN" artisan view:cache || true
            "$PHP_BIN" artisan permission:cache-reset || true
            "$PHP_BIN" artisan queue:restart || true

            echo ""
            echo "======================================"
            echo " DEPLOYMENT SUCCESS"
            echo "======================================"

            cat .deployment-info || true

      - name: Production health check
        shell: bash
        run: |
          echo "Checking ${{ env.APP_URL }} ..."

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl \
              -k \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 20 \
              "${{ env.APP_URL }}/login" || true)

            echo "Attempt $i -> HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || \
               [ "$HTTP_CODE" = "301" ] || \
               [ "$HTTP_CODE" = "302" ]; then
              echo "Production is reachable."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Production health check failed."
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SATUATK Production"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Actor: @${GITHUB_ACTOR}"
            echo "- Server: \`${{ secrets.SSH_HOST }}\`"
            echo "- Directory: \`${{ env.APP_DIR }}\`"
            echo "- URL: ${{ env.APP_URL }}"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
