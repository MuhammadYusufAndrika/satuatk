name: Deploy SATUATK Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: satuatk-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'
  APP_DIR: /home/taud1675/public_html/satuatk.yusufandrika.dev
  APP_URL: https://satuatk.yusufandrika.dev

jobs:
  deploy:
    name: Build & Deploy SATUATK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=""

          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}" ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.SSH_PORT }}" ] && missing="$missing SSH_PORT"

          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum lengkap:$missing"
            exit 1
          fi

          echo "Deployment secrets OK."

      - name: Check development backdoor
        shell: bash
        run: |
          if grep -rn "bypass-login" routes/ app/ 2>/dev/null; then
            echo "::error::Route bypass-login masih ditemukan."
            echo "Hapus route development sebelum production."
            exit 1
          fi

          echo "Security check OK."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, fileinfo, openssl, tokenizer, xml, ctype, curl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify Vite build
        shell: bash
        run: |
          if [ ! -f "public/build/manifest.json" ] && \
             [ ! -f "public/build/.vite/manifest.json" ]; then
            echo "::error::Vite manifest tidak ditemukan."
            ls -lah public || true
            exit 1
          fi

          echo "Vite build OK."
          du -sh public/build

      - name: Prepare deployment package
        shell: bash
        run: |
          rm -rf .git .github node_modules tests

          rm -f \
            public/hot \
            composer.phar \
            npm-debug.log \
            yarn-error.log

          rm -rf storage/logs/*
          rm -rf storage/framework/cache/*
          rm -rf storage/framework/sessions/*
          rm -rf storage/framework/views/*

          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment-info

          echo "Deployment package:"
          du -sh vendor || true
          du -sh public/build || true

      # Shared hosting tidak menyediakan rsync, jadi deployment
      # dikirim sebagai TAR.GZ melalui SCP.
      - name: Create deployment archive
        shell: bash
        run: |
          rm -f /tmp/satuatk-deploy.tar.gz

          tar \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./public/storage' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/views/*' \
            -czf /tmp/satuatk-deploy.tar.gz .

          echo "Archive created:"
          ls -lh /tmp/satuatk-deploy.tar.gz

      - name: Upload deployment archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "satuatk-deploy.tar.gz"
          target: "/home/${{ secrets.SSH_USER }}/"

      - name: Extract deployment on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            ARCHIVE="/home/${{ secrets.SSH_USER }}/satuatk-deploy.tar.gz"

            echo "Preparing deployment directory..."
            mkdir -p "$APP_DIR"

            if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Deployment archive tidak ditemukan: $ARCHIVE"
              exit 1
            fi

            # .env dan storage production dipertahankan.
            cd "$APP_DIR"

            find . \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name '.env' \
              ! -name 'storage' \
              -exec rm -rf -- {} +

            echo "Extracting application..."
            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"

            # Pastikan folder runtime Laravel tersedia.
            mkdir -p \
              storage/app \
              storage/framework/cache \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs \
              bootstrap/cache

            echo "Deployment files extracted."

      - name: Run Laravel deployment tasks
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            PHP_BIN="/opt/alt/php82/usr/bin/php"

            cd "$APP_DIR"

            echo "======================================"
            echo " SATUATK Production Deployment"
            echo "======================================"

            echo "PHP version:"
            "$PHP_BIN" -v | head -n 1

            if [ ! -f ".env" ]; then
              echo "ERROR: .env production tidak ditemukan."
              echo "Lokasi seharusnya: $APP_DIR/.env"
              exit 1
            fi

            if ! grep -q '^APP_KEY=base64:' .env; then
              echo "ERROR: APP_KEY belum dikonfigurasi."
              exit 1
            fi

            if ! grep -q '^APP_ENV=production' .env; then
              echo "WARNING: APP_ENV bukan production."
            fi

            if ! grep -q '^APP_DEBUG=false' .env; then
              echo "WARNING: APP_DEBUG belum false."
            fi

            chmod -R 775 storage bootstrap/cache || true

            # Beberapa command Artisan non-esensial dapat gagal pada
            # shared hosting karena proc_open dinonaktifkan.
            "$PHP_BIN" artisan optimize:clear || true

            # Migration production: jangan migrate:fresh / seed otomatis.
            "$PHP_BIN" artisan migrate --force

            "$PHP_BIN" artisan config:cache || true
            "$PHP_BIN" artisan route:cache || true
            "$PHP_BIN" artisan view:cache || true
            "$PHP_BIN" artisan permission:cache-reset || true
            "$PHP_BIN" artisan queue:restart || true

            echo ""
            echo "======================================"
            echo " DEPLOYMENT SUCCESS"
            echo "======================================"

            cat .deployment-info || true

      - name: Production health check
        shell: bash
        run: |
          echo "Checking ${{ env.APP_URL }} ..."

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl \
              -k \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 20 \
              "${{ env.APP_URL }}/login" || true)

            echo "Attempt $i -> HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || \
               [ "$HTTP_CODE" = "301" ] || \
               [ "$HTTP_CODE" = "302" ]; then
              echo "Production is reachable."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Production health check failed."
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SATUATK Production"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Actor: @${GITHUB_ACTOR}"
            echo "- Server: \`${{ secrets.SSH_HOST }}\`"
            echo "- Directory: \`${{ env.APP_DIR }}\`"
            echo "- URL: ${{ env.APP_URL }}"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"