name: Deploy SATUATK Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: satuatk-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

  # Production
  APP_DIR: /home/taud1675/public_html/satuatk.id
  APP_URL: https://satuatk.id

jobs:
  deploy:
    name: Build & Deploy SATUATK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VALIDATE SECRETS
      # ============================================================

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=""

          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}" ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.SSH_PORT }}" ] && missing="$missing SSH_PORT"

          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum lengkap:$missing"
            exit 1
          fi

          echo "Deployment secrets OK."


      # ============================================================
      # 3. SECURITY CHECK
      # ============================================================

      - name: Check development backdoor
        shell: bash
        run: |
          if grep -rn "bypass-login" routes/ app/ 2>/dev/null; then
            echo "::error::Route bypass-login masih ditemukan."
            echo "Hapus route development sebelum production."
            exit 1
          fi

          echo "Security check OK."


      # ============================================================
      # 4. PHP + COMPOSER
      # ============================================================

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, fileinfo, openssl, tokenizer, xml, ctype, curl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress


      # ============================================================
      # 5. NODE + VITE BUILD
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify Vite build
        shell: bash
        run: |
          if [ ! -f "public/build/manifest.json" ] && \
             [ ! -f "public/build/.vite/manifest.json" ]; then

            echo "::error::Vite manifest tidak ditemukan."

            echo "Isi public:"
            ls -lah public || true

            echo "Isi public/build:"
            ls -lah public/build || true

            exit 1
          fi

          echo "Vite build OK."
          du -sh public/build


      # ============================================================
      # 6. PREPARE DEPLOYMENT
      # ============================================================

      - name: Prepare deployment package
        shell: bash
        run: |
          # File/folder development tidak diperlukan di production
          rm -rf .git
          rm -rf .github
          rm -rf node_modules
          rm -rf tests

          rm -f public/hot
          rm -f composer.phar
          rm -f npm-debug.log
          rm -f yarn-error.log

          # Jangan membawa runtime cache/log lokal
          rm -rf storage/logs/*
          rm -rf storage/framework/cache/*
          rm -rf storage/framework/sessions/*
          rm -rf storage/framework/views/*

          # Informasi deployment
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment-info

          echo "======================================"
          echo " Deployment Package"
          echo "======================================"

          du -sh vendor || true
          du -sh public/build || true


      # ============================================================
      # 7. CREATE ARCHIVE
      #
      # Archive dibuat di /tmp agar TAR tidak membaca archive
      # yang sedang dibuat.
      # ============================================================

      - name: Create deployment archive
        shell: bash
        run: |
          ARCHIVE="/tmp/satuatk-deploy.tar.gz"

          rm -f "$ARCHIVE"

          tar \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./public/storage' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/views/*' \
            -czf "$ARCHIVE" .

          echo "Archive successfully created:"
          ls -lh "$ARCHIVE"

          # appleboy/scp-action source bekerja dari workspace,
          # sehingga copy archive ke workspace setelah TAR selesai.
          cp "$ARCHIVE" ./satuatk-deploy.tar.gz

          echo "Workspace archive:"
          ls -lh ./satuatk-deploy.tar.gz


      # ============================================================
      # 8. UPLOAD ARCHIVE
      # ============================================================

      - name: Upload deployment archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          source: "satuatk-deploy.tar.gz"

          target: "/home/${{ secrets.SSH_USER }}/"

          overwrite: true


      # ============================================================
      # 9. EXTRACT ON CPANEL SERVER
      # ============================================================

      - name: Extract deployment on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            ARCHIVE="/home/${{ secrets.SSH_USER }}/satuatk-deploy.tar.gz"

            echo "======================================"
            echo " Preparing SATUATK deployment"
            echo "======================================"

            echo "Target:"
            echo "$APP_DIR"

            mkdir -p "$APP_DIR"

            if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Deployment archive tidak ditemukan:"
              echo "$ARCHIVE"
              exit 1
            fi


            # ------------------------------------------------------
            # .env production WAJIB sudah ada sebelum deployment.
            # ------------------------------------------------------

            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: .env production tidak ditemukan."
              echo "Expected:"
              echo "$APP_DIR/.env"
              echo ""
              echo "Buat .env production terlebih dahulu."
              exit 1
            fi


            # ------------------------------------------------------
            # Hapus source deployment lama
            #
            # TETAPI pertahankan:
            # - .env
            # - storage
            # ------------------------------------------------------

            cd "$APP_DIR"

            echo "Cleaning previous deployment..."

            find . \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name '.env' \
              ! -name 'storage' \
              -exec rm -rf -- {} +


            # ------------------------------------------------------
            # Extract release baru
            # ------------------------------------------------------

            echo "Extracting new deployment..."

            tar -xzf "$ARCHIVE" -C "$APP_DIR"

            rm -f "$ARCHIVE"


            # ------------------------------------------------------
            # Runtime directories Laravel
            # ------------------------------------------------------

            mkdir -p \
              storage/app \
              storage/app/public \
              storage/framework/cache \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs \
              bootstrap/cache


            chmod -R 775 storage bootstrap/cache || true

            echo "Deployment files extracted successfully."


      # ============================================================
      # 10. LARAVEL PRODUCTION TASKS
      # ============================================================

      - name: Run Laravel deployment tasks
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            PHP_BIN="/opt/alt/php82/usr/bin/php"

            cd "$APP_DIR"

            echo "======================================"
            echo " SATUATK Production Deployment"
            echo "======================================"

            echo ""
            echo "Application directory:"
            pwd

            echo ""
            echo "PHP:"
            "$PHP_BIN" -v | head -n 1


            # ------------------------------------------------------
            # Validate production .env
            # ------------------------------------------------------

            if [ ! -f ".env" ]; then
              echo "ERROR: .env production tidak ditemukan."
              exit 1
            fi

            if ! grep -q '^APP_KEY=base64:' .env; then
              echo "ERROR: APP_KEY belum dikonfigurasi."
              exit 1
            fi

            if ! grep -q '^APP_ENV=production' .env; then
              echo "WARNING: APP_ENV bukan production."
            fi

            if ! grep -q '^APP_DEBUG=false' .env; then
              echo "WARNING: APP_DEBUG belum false."
            fi

            if ! grep -q '^APP_URL=https://satuatk.id' .env; then
              echo "WARNING: APP_URL seharusnya https://satuatk.id"
            fi


            # ------------------------------------------------------
            # Permission
            # ------------------------------------------------------

            chmod -R 775 storage bootstrap/cache || true


            # ------------------------------------------------------
            # Laravel cache
            #
            # proc_open dinonaktifkan di shared hosting.
            # Karena itu command cache non-kritis dibuat tolerant.
            # ------------------------------------------------------

            echo ""
            echo "Clearing Laravel cache..."

            "$PHP_BIN" artisan optimize:clear || true


            # ------------------------------------------------------
            # DATABASE
            #
            # JANGAN menggunakan:
            #
            # php artisan migrate:fresh
            #
            # pada production.
            # ------------------------------------------------------

            echo ""
            echo "Running database migrations..."

            "$PHP_BIN" artisan migrate --force


            # ------------------------------------------------------
            # Production optimization
            # ------------------------------------------------------

            echo ""
            echo "Building Laravel caches..."

            "$PHP_BIN" artisan config:cache || true
            "$PHP_BIN" artisan route:cache || true
            "$PHP_BIN" artisan view:cache || true


            # ------------------------------------------------------
            # Spatie Permission
            # ------------------------------------------------------

            "$PHP_BIN" artisan permission:cache-reset || true


            # ------------------------------------------------------
            # Queue
            # ------------------------------------------------------

            "$PHP_BIN" artisan queue:restart || true


            echo ""
            echo "======================================"
            echo " DEPLOYMENT SUCCESS"
            echo "======================================"

            echo ""

            cat .deployment-info || true


      # ============================================================
      # 11. PRODUCTION HEALTH CHECK
      # ============================================================

      - name: Production health check
        shell: bash
        run: |
          echo "Checking production:"
          echo "${{ env.APP_URL }}/login"

          for i in 1 2 3 4 5; do

            HTTP_CODE=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 20 \
              "${{ env.APP_URL }}/login" || true)

            echo "Attempt $i -> HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || \
               [ "$HTTP_CODE" = "301" ] || \
               [ "$HTTP_CODE" = "302" ]; then

              echo "Production is reachable."
              exit 0

            fi

            sleep 10
          done

          echo "::error::Production health check failed."

          exit 1


      # ============================================================
      # 12. CLEAN LOCAL ARCHIVE
      # ============================================================

      - name: Cleanup deployment archive
        if: always()
        shell: bash
        run: |
          rm -f ./satuatk-deploy.tar.gz
          rm -f /tmp/satuatk-deploy.tar.gz


      # ============================================================
      # 13. GITHUB SUMMARY
      # ============================================================

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SATUATK Production"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Actor: @${GITHUB_ACTOR}"
            echo "- Server: \`${{ secrets.SSH_HOST }}\`"
            echo "- Directory: \`${{ env.APP_DIR }}\`"
            echo "- URL: ${{ env.APP_URL }}"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"