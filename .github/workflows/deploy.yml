name: Deploy SATUATK Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: satuatk-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'
  APP_DIR: /home/taud1675/public_html/satuatk.id
  APP_URL: https://satuatk.id

jobs:
  deploy:
    name: Build & Deploy SATUATK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          missing=""
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}" ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.SSH_PORT }}" ] && missing="$missing SSH_PORT"
          if [ -n "$missing" ]; then
            echo "::error::Secrets belum lengkap:$missing (isi di Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Block dev backdoor route
        run: |
          if grep -rn "bypass-login" routes/ app/ 2>/dev/null; then
            echo "::error::Route bypass-login masih ada — hapus dari routes/web.php dulu."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, fileinfo, openssl, tokenizer, xml, ctype, curl, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json -o -f public/build/.vite/manifest.json || {
            echo "::error::Manifest Vite tidak ditemukan — build gagal."
            exit 1
          }

      # Satu file tar.gz: vendor/ + public/build/ ikut (shared hosting
      # biasanya tidak bisa composer install / npm build), .env + isi
      # storage tidak ikut. Lebih cepat dari rsync ribuan file kecil.
      - name: Create deployment archive
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment-info
          tar --exclude='./.git' --exclude='./.github' --exclude='./node_modules' \
              --exclude='./tests' --exclude='./.env' --exclude='./.env.*' \
              --exclude='./public/hot' --exclude='./public/storage' \
              --exclude='./storage/logs/*' --exclude='./storage/framework/sessions/*' \
              --exclude='./storage/framework/cache/*' --exclude='./storage/framework/views/*' \
              --exclude='./composer.phar' --exclude='./*.log' \
              --exclude='./satuatk-deploy.tar.gz' \
              -czf satuatk-deploy.tar.gz .
          ls -lh satuatk-deploy.tar.gz

      - name: Upload archive to cPanel
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: satuatk-deploy.tar.gz
          target: /home/${{ secrets.SSH_USER }}/
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR="${{ env.APP_DIR }}"
            ARCHIVE="/home/${{ secrets.SSH_USER }}/satuatk-deploy.tar.gz"
            [ -f "$ARCHIVE" ] || { echo "ERROR: archive tidak ditemukan."; exit 1; }
            [ -f "$APP_DIR/.env" ] || { echo "ERROR: $APP_DIR/.env belum ada — buat manual sekali di server."; exit 1; }

            # Binary PHP 8.2 lokasinya beda-beda tiap hosting.
            if [ -x /opt/cpanel/ea-php82/root/usr/bin/php ]; then PHP_BIN=/opt/cpanel/ea-php82/root/usr/bin/php;
            elif [ -x /usr/local/bin/php ]; then PHP_BIN=/usr/local/bin/php;
            else PHP_BIN=php; fi

            mkdir -p "$APP_DIR" && cd "$APP_DIR"
            $PHP_BIN artisan down --retry=60 || true

            # Bersihkan kode lama, pertahankan .env + storage production.
            find . -mindepth 1 -maxdepth 1 ! -name '.env' ! -name 'storage' -exec rm -rf -- {} +
            tar -xzf "$ARCHIVE" && rm -f "$ARCHIVE"
            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions \
                     storage/framework/views storage/logs bootstrap/cache

            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan storage:link || true
            chmod -R 775 storage bootstrap/cache || true
            $PHP_BIN artisan up || true
            cat .deployment-info

      - name: Health check
        run: |
          code=$(curl -Ls -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.APP_URL }}/login" || echo 000)
          echo "HTTP $code"
          [ "$code" = "200" ] || echo "::warning::Deploy selesai tapi /login mengembalikan HTTP $code."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## SATUATK Production"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\` (@${GITHUB_ACTOR})"
            echo "- Directory: \`${{ env.APP_DIR }}\`"
            echo "- URL: ${{ env.APP_URL }}"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
