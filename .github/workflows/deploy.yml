name: Deploy SATUATK Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: satuatk-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

  APP_DIR: /home/taud1675/public_html/satuatk.id
  APP_URL: https://satuatk.id

jobs:
  deploy:
    name: Build & Deploy SATUATK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VALIDATE SSH SECRETS
      # ============================================================

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=""

          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}" ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.SSH_PORT }}" ] && missing="$missing SSH_PORT"

          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum lengkap:$missing"
            exit 1
          fi

          echo "Deployment secrets OK."


      # ============================================================
      # 3. SECURITY CHECK
      # ============================================================

      - name: Check development backdoor
        shell: bash
        run: |
          if grep -rn "bypass-login" routes/ app/ 2>/dev/null; then
            echo "::error::Route bypass-login masih ditemukan."
            echo "Hapus route development sebelum production."
            exit 1
          fi

          echo "Security check OK."


      # ============================================================
      # 4. PHP + COMPOSER
      # ============================================================

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, fileinfo, openssl, tokenizer, xml, ctype, curl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress


      # ============================================================
      # 5. NODE + VITE BUILD
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build


      # ============================================================
      # 6. VERIFY BUILD
      # ============================================================

      - name: Verify Vite build
        shell: bash
        run: |
          if [ ! -f "public/build/manifest.json" ] && \
             [ ! -f "public/build/.vite/manifest.json" ]; then

            echo "::error::Vite manifest tidak ditemukan."

            echo "Isi public:"
            ls -lah public || true

            echo "Isi public/build:"
            ls -lah public/build || true

            exit 1
          fi

          echo "Vite build OK."
          du -sh public/build


      # ============================================================
      # 7. PREPARE DEPLOYMENT PACKAGE
      # ============================================================

      - name: Prepare deployment package
        shell: bash
        run: |
          # Hapus file yang tidak dibutuhkan production
          rm -rf .git
          rm -rf .github
          rm -rf node_modules
          rm -rf tests

          rm -f public/hot
          rm -f composer.phar
          rm -f npm-debug.log
          rm -f yarn-error.log

          # Jangan membawa runtime lokal
          rm -rf storage/logs/*
          rm -rf storage/framework/cache/*
          rm -rf storage/framework/sessions/*
          rm -rf storage/framework/views/*

          # Informasi deployment
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployment-info

          echo "======================================"
          echo " SATUATK Deployment Package"
          echo "======================================"

          echo "Vendor:"
          du -sh vendor || true

          echo "Frontend build:"
          du -sh public/build || true


      # ============================================================
      # 8. CREATE ARCHIVE
      # ============================================================

      - name: Create deployment archive
        shell: bash
        run: |
          ARCHIVE="/tmp/satuatk-deploy.tar.gz"

          rm -f "$ARCHIVE"
          rm -f ./satuatk-deploy.tar.gz

          tar \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./public/storage' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/views/*' \
            -czf "$ARCHIVE" .

          echo "Archive created:"
          ls -lh "$ARCHIVE"

          # scp-action membaca file dari workspace
          cp "$ARCHIVE" ./satuatk-deploy.tar.gz

          echo "Archive ready for upload:"
          ls -lh ./satuatk-deploy.tar.gz


      # ============================================================
      # 9. UPLOAD TO CPANEL
      # ============================================================

      - name: Upload deployment archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "satuatk-deploy.tar.gz"
          target: "/home/${{ secrets.SSH_USER }}/"
          overwrite: true


      # ============================================================
      # 10. DEPLOY ON SERVER
      # ============================================================

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            ARCHIVE="/home/${{ secrets.SSH_USER }}/satuatk-deploy.tar.gz"

            echo "======================================"
            echo " Deploying SATUATK"
            echo "======================================"

            echo "Target:"
            echo "$APP_DIR"

            mkdir -p "$APP_DIR"

            # Pastikan archive tersedia
            if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Deployment archive tidak ditemukan."
              echo "$ARCHIVE"
              exit 1
            fi

            # .env production tidak dikirim GitHub
            # dan harus tetap berada di server
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: .env production tidak ditemukan."
              echo "Expected: $APP_DIR/.env"
              exit 1
            fi

            cd "$APP_DIR"

            echo ""
            echo "Cleaning previous application files..."

            # Pertahankan:
            # - .env production
            # - storage production
            find . \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name '.env' \
              ! -name 'storage' \
              -exec rm -rf -- {} +

            echo ""
            echo "Extracting new application..."

            tar -xzf "$ARCHIVE" -C "$APP_DIR"

            rm -f "$ARCHIVE"

            # Pastikan runtime directory Laravel tersedia
            mkdir -p \
              storage/app \
              storage/app/public \
              storage/framework/cache \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs \
              bootstrap/cache

            chmod -R 775 storage bootstrap/cache || true

            echo ""
            echo "======================================"
            echo " DEPLOYMENT SUCCESS"
            echo "======================================"

            cat .deployment-info || true


      # ============================================================
      # 11. HEALTH CHECK
      # ============================================================

      - name: Production health check
        shell: bash
        run: |
          echo "Checking ${{ env.APP_URL }}/login ..."

          HTTP_CODE=$(curl \
            -L \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            --max-time 20 \
            "${{ env.APP_URL }}/login" || true)

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || \
             [ "$HTTP_CODE" = "301" ] || \
             [ "$HTTP_CODE" = "302" ]; then

            echo "Production reachable."
            exit 0
          fi

          # Deployment tidak dibuat gagal hanya karena health check.
          echo "::warning::Deployment selesai, tetapi health check mendapat HTTP $HTTP_CODE."


      # ============================================================
      # 12. CLEANUP
      # ============================================================

      - name: Cleanup deployment archive
        if: always()
        shell: bash
        run: |
          rm -f ./satuatk-deploy.tar.gz
          rm -f /tmp/satuatk-deploy.tar.gz


      # ============================================================
      # 13. DEPLOYMENT SUMMARY
      # ============================================================

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SATUATK Production"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Actor: @${GITHUB_ACTOR}"
            echo "- Directory: \`${{ env.APP_DIR }}\`"
            echo "- URL: ${{ env.APP_URL }}"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"